name: CI - Build and Test (Windows)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

n      - name: Setup .NET (用于 dotnet restore/test)
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

n      - name: Restore NuGet packages
        run: nuget restore BookmarkStudio.slnx

n      - name: Build solution (MSBuild)
        run: msbuild BookmarkStudio.slnx /p:Configuration=Release /m

n      - name: Run tests
        run: dotnet test test/BookmarkStudio.Test/BookmarkStudio.Test.csproj -c Release

n      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: |
            src/**/bin/**/Release/**/*.vsix
            src/**/bin/**/Debug/**/*.vsix
